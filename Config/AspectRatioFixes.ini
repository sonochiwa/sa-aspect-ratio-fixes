# Aspect Ratio Fixes v1.5.0
# Created by sonochiwa
# Source code: https://github.com/sonochiwa/sa-aspect-ratio-fixes

[general]
log=0
# Typed in game like a cheat to reload this file. Empty disables it.
command=ASPECTFIXES

[radar]
roundRadar=1
roundBlips=1
# Only while roundRadar=1. Units of screen height, not pixels.
diameter=86
marginLeft=40
marginBottom=28

[crosshair]
roundCrosshair=1
roundScope=1
noCameraCrosshair=0
hideCameraHud=0
hideSniperHud=0

[hud]
fixPlayerInfo=1
# The aspect the block is laid out for. 0 keeps the screen's own.
playerInfoAspect=16:9
# Percent of that size. 0 keeps it.
playerInfoScale=0
# Right margin in units of screen height. 0 keeps the game's 32.
playerInfoMarginRight=0

[text]
fixText=1
# The aspect the text is proportioned for. 0 keeps the screen's own.
textAspect=16:9

[widescreen]
useScreenAspect=0
# Does nothing while useScreenAspect=0.
fixFov=1

[worldSprites]
pickups=1
coronas=1
coronaReflections=1
sunMoon=1
pointLights=1
birds=1
clouds=1
checkpoints=1
weaponEffects=1
cameraEffects=1

[aaEdgeFrame]
# Pixels per side. 0 leaves that edge alone.
left=1
top=1
right=1
bottom=1

[samp]
fitTextdraws=1
# The aspect the server laid its textdraws out for. Wider screens only.
textdrawAspect=16:9
