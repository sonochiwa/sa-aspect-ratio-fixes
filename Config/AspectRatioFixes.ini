# SA Aspect Ratio Fixes v1.0.0
# Created by sonochiwa
# Source code: https://github.com/sonochiwa/sa-aspect-ratio-fixes
#
# Edit and press Alt+H in game to apply without restarting.

[general]
log=0
showNotifications=1
# Decimal Win32 virtual-key codes. 18 is Alt, 72 is H. hotkeyKey=0 disables it.
hotkeyModifier=18
hotkeyKey=72

[radar]
roundRadar=1
roundBlips=1
# In units of screen height, so they hold on any resolution. Only used while
# roundRadar=1.
diameter=76
marginLeft=40
marginBottom=28

[crosshair]
roundCrosshair=1
# Needs roundCrosshair=1.
roundScope=1
noCameraCrosshair=0
hideCameraHud=0
hideSniperHud=0

[widescreen]
useScreenAspect=1
# Does nothing while useScreenAspect=0.
fixFov=1

[worldSprites]
pickups=1
coronas=1
coronaReflections=1
sunMoon=1
pointLights=1
birds=1
clouds=1
checkpoints=1
weaponEffects=1
cameraEffects=1
# Experimental. Affects weapon target selection rather than visuals alone.
targetingMeasurements=0

[probe]
# Development diagnostic, not a fix. See the README.
enabled=0
group=0
hotkeyModifier=18
hotkeyKey=80